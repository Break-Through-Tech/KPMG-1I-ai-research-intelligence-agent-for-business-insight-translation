name: Scrape New arXiv Papers

on:
  schedule:
    - cron: "0 1 * * 2,4,6"  # 9:00 PM EDT Mon/Wed/Fri (update to "0 2 * * 2,4,6" after DST ends in Nov)
  workflow_dispatch:

permissions:
  contents: write   # so the workflow can push seen_papers.json back

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # arxiv package requires 3.10+
          cache: pip

      - name: Install dependencies
        run: |
          # CPU-only torch keeps the install small (sentence-transformers needs torch)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Scrape papers into the vector store
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python -m scripts.scrape_papers

      # Runs even if some papers failed, so the ones that succeeded are recorded.
      # Only the seen-papers log is committed - no PDFs.
      - name: Commit updated seen_papers.json
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_papers.json
          git diff --staged --quiet || git commit -m "Auto-scrape: update seen papers"
          git push
