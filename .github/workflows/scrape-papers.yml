name: Scrape New arXiv Papers

on:
  schedule:
    - cron: "0 1 * * 2,4,6"  # 9:00 PM EDT Mon/Wed/Fri (update to "0 2 * * 2,4,6" after DST ends in Nov)
  workflow_dispatch:

permissions:
  contents: write   # required so the workflow can push commits back

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # arxiv package requires 3.10+

      - name: Install only what this job needs
        run: pip install arxiv

      - name: Run scraper
        run: |
          cd scripts
          python scrape_papers.py

      - name: Commit and push new papers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Auto-scrape: add new papers"
          git push