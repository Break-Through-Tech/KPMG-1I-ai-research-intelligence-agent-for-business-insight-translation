name: Scrape New arXiv Papers

on:
  schedule:
    - cron: "0 1 * * 2,4,6"  # 9:00 PM EDT Mon/Wed/Fri (update to "0 2 * * 2,4,6" after DST ends in Nov)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Scrape and store papers (B2 + Qdrant)
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python -m scripts.scrape_papers

      - name: Commit updated seen_papers.json
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_papers.json
          git diff --staged --quiet || git commit -m "Auto-scrape: update seen papers"
          git push
